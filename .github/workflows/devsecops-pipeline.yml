name: DevSecOps Pipeline

on:
  push:
    branches: [ main, hardened ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.9'

jobs:

  # ==========================================
  # SAST - Static Application Security Testing
  # ==========================================
  sast-codeql:
    name: SAST - CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a  # v3
        with:
          languages: python
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a  # v3
        with:
          category: "/language:python"

  # ==========================================
  # SCA - Software Composition Analysis
  # ==========================================
  sca-trivy:
    name: SCA - Dependency Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Run Trivy vulnerability scanner (hardened requirements)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # master (v0.36.0)
        with:
          scan-type: 'fs'
          scan-ref: 'requirements-hardened.txt'
          format: 'sarif'
          output: 'trivy-sca-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '1'

      - name: Upload Trivy SCA results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a  # v3
        if: always()
        with:
          sarif_file: 'trivy-sca-results.sarif'
          category: 'sca-trivy'

  # ==========================================
  # IaC - Infrastructure as Code Scanning
  # ==========================================
  iac-scanning:
    name: IaC - Terraform Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Show IaC findings in log (table format, never fails)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'config'
          scan-ref: 'terraform/'
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'
          trivyignores: 'terraform/.trivyignore'

      - name: Run Trivy IaC scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # master (v0.36.0)
        with:
          scan-type: 'config'
          scan-ref: 'terraform/'
          format: 'sarif'
          output: 'trivy-iac-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '1'
          trivyignores: 'terraform/.trivyignore'

      - name: Upload IaC scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a  # v3
        if: always()
        with:
          sarif_file: 'trivy-iac-results.sarif'
          category: 'iac-trivy'

  # ==========================================
  # Secret Detection
  # ==========================================
  secret-scanning:
    name: Secret Detection - Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks (git history scan, allowlisted via .gitleaks.toml)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Gitleaks filesystem scan (current working tree)
        run: |
          docker run --rm -v "$(pwd):/path" \
            ghcr.io/gitleaks/gitleaks:latest \
            detect --source /path --no-git --redact \
            --config /path/.gitleaks.toml \
            --exit-code 1

  # ==========================================
  # Container Security
  # ==========================================
  container-scanning:
    name: Container Security - Image Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [sast-codeql, sca-trivy]
    if: always()
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Build hardened Docker image
        run: docker build -f Dockerfile.hardened -t devsecops-hardened:latest .

      - name: Run Trivy container scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # master (v0.36.0)
        with:
          image-ref: 'devsecops-hardened:latest'
          format: 'sarif'
          output: 'trivy-container-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload container scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a  # v3
        if: always()
        with:
          sarif_file: 'trivy-container-results.sarif'
          category: 'container-trivy'

  # ==========================================
  # Security Summary
  # ==========================================
  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [sast-codeql, sca-trivy, iac-scanning, secret-scanning, container-scanning]
    if: always()

    steps:
      - name: Write summary
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scan Type | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| SAST (CodeQL) | ${{ needs.sast-codeql.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SCA (Trivy) | ${{ needs.sca-trivy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| IaC Scanning | ${{ needs.iac-scanning.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Detection | ${{ needs.secret-scanning.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Container Scan | ${{ needs.container-scanning.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Hardened branch: all vulnerabilities remediated. See REMEDIATION.md for full before/after detail." >> $GITHUB_STEP_SUMMARY
