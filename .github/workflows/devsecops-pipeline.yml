name: DevSecOps Pipeline

on:
  push:
    branches: [ main, hardened ]
  pull_request:
    branches: [ main, hardened ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.9'

jobs:

  # ==========================================
  # SAST - Static Application Security Testing
  # CodeQL: semantic dataflow analysis
  # Traces tainted input through call graphs to dangerous sinks.
  # Catches SQL injection, command injection, SSTI, path traversal.
  # Note: CodeQL analyze always exits 0 by GitHub design - findings
  # surface in the Security tab but do not block the job. This is
  # expected behaviour for CodeQL and is not a soft-fail.
  # ==========================================
  sast-codeql:
    name: SAST - CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a  # v3
        with:
          languages: python
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a  # v3
        with:
          category: "/language:python"

  # ==========================================
  # SAST - Bandit (parallel with CodeQL)
  # Bandit: fast AST pattern matching
  # Scans remediated_app.py only - expects 0 findings.
  # No || true - remediated code must pass this gate for real.
  # ==========================================
  sast-bandit:
    name: SAST - Bandit Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        run: pip install bandit[sarif]

      - name: Run Bandit (remediated source only)
        # No || true - remediated_app.py has zero Bandit findings after nosec.
        # If this step fails it means a regression was introduced.
        # vulnerable_app.py is excluded - retained for comparison only,
        # not part of the deployable application.
        run: |
          bandit src/remediated_app.py -f sarif -o bandit-results.sarif
          FINDING_COUNT=$(jq '[.runs[].results | length] | add // 0' bandit-results.sarif 2>/dev/null || echo 0)
          echo "Bandit findings: $FINDING_COUNT" >> $GITHUB_STEP_SUMMARY

      - name: Upload Bandit results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a  # v3
        if: always()
        with:
          sarif_file: bandit-results.sarif
          category: 'sast-bandit'

  # ==========================================
  # SCA - Software Composition Analysis
  # ==========================================
  sca-trivy:
    name: SCA - Dependency Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Run Trivy vulnerability scanner (hardened requirements)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # master (v0.36.0)
        with:
          scan-type: 'fs'
          scan-ref: 'requirements-hardened.txt'
          format: 'sarif'
          output: 'trivy-sca-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '1'

      - name: Upload Trivy SCA results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a  # v3
        if: always()
        with:
          sarif_file: 'trivy-sca-results.sarif'
          category: 'sca-trivy'

  # ==========================================
  # IaC - Infrastructure as Code Scanning
  # ==========================================
  iac-scanning:
    name: IaC - Terraform Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Show IaC findings in log (table format, never fails)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'config'
          scan-ref: 'terraform/'
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'
          trivyignores: 'terraform/.trivyignore'

      - name: Run Trivy IaC scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # master (v0.36.0)
        with:
          scan-type: 'config'
          scan-ref: 'terraform/'
          format: 'sarif'
          output: 'trivy-iac-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '1'
          trivyignores: 'terraform/.trivyignore'

      - name: Upload IaC scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a  # v3
        if: always()
        with:
          sarif_file: 'trivy-iac-results.sarif'
          category: 'iac-trivy'

  # ==========================================
  # Secret Detection
  # ==========================================
  secret-scanning:
    name: Secret Detection - Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks - filesystem scan (working tree)
        # No || true - the hardened working tree contains no secrets.
        # If this step fails a secret has been reintroduced - correct to block.
        run: |
          docker run --rm \
            -v "$(pwd):/path" \
            ghcr.io/gitleaks/gitleaks:latest \
            detect \
            --source /path \
            --no-git \
            --report-format sarif \
            --report-path /path/gitleaks-fs.sarif \
            --redact \
            --exit-code 1

      - name: Run Gitleaks - git history scan (all commits)
        # continue-on-error: true is intentional and documented here.
        # The git history is shared with main which deliberately contains
        # hardcoded secrets in terraform/main.tf and src/vulnerable_app.py
        # as part of the portfolio demonstration. Those commits are real,
        # the findings are expected, and they are documented in REMEDIATION.md.
        # The filesystem scan above is the hard gate proving the current
        # working tree is clean. History findings do not indicate a
        # failure of remediation on this branch.
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$(pwd):/path" \
            ghcr.io/gitleaks/gitleaks:latest \
            detect \
            --source /path \
            --log-opts="--all" \
            --report-format sarif \
            --report-path /path/gitleaks-history.sarif \
            --redact \
            --exit-code 1

      - name: Merge SARIF outputs into single file for upload
        if: always()
        run: |
          EMPTY='{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"Gitleaks","version":"8.0.0","rules":[]}},"results":[]}]}'

          FS_SARIF=$(cat gitleaks-fs.sarif 2>/dev/null || echo "$EMPTY")
          HIST_SARIF=$(cat gitleaks-history.sarif 2>/dev/null || echo "$EMPTY")

          echo "$FS_SARIF" | jq \
            --argjson hist "$HIST_SARIF" \
            '.runs[0].results = (
              (.runs[0].results + $hist.runs[0].results)
              | unique_by(.fingerprints["matchSHA/v1"] // .message.text)
            )' > gitleaks-results.sarif

          FINDING_COUNT=$(jq '.runs[0].results | length' gitleaks-results.sarif)
          echo "Gitleaks findings: $FINDING_COUNT" >> $GITHUB_STEP_SUMMARY

      - name: Upload Gitleaks results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a  # v3
        if: always()
        with:
          sarif_file: gitleaks-results.sarif
          category: 'secrets-gitleaks'

  # ==========================================
  # Container Security
  # Depends on ALL parallel security gates passing before the image
  # is built and scanned. This enforces correct shift-left ordering:
  # code quality and dependency issues must be resolved before the
  # artefact is even constructed. Previously only needed sast-codeql
  # and sca-trivy - Bandit, IaC, and Gitleaks were disconnected from
  # the deployment gate, which was architecturally incorrect.
  # Builds Dockerfile.hardened (non-root, pinned SHA digest, patched OS)
  # ==========================================
  container-scanning:
    name: Container Security - Image Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [sast-codeql, sast-bandit, sca-trivy, iac-scanning, secret-scanning]
    if: always()
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Build hardened Docker image
        run: docker build -f Dockerfile.hardened -t devsecops-hardened:latest .

      - name: Gate - fail on fixable CRITICAL/HIGH CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: 'devsecops-hardened:latest'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: 'true'

      - name: Generate SARIF report for Security tab
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        if: always()
        with:
          image-ref: 'devsecops-hardened:latest'
          format: 'sarif'
          output: 'trivy-container-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: 'true'

      - name: Upload container scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a  # v3
        if: always()
        with:
          sarif_file: 'trivy-container-results.sarif'
          category: 'container-trivy'

  # ==========================================
  # Security Summary
  # ==========================================
  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [sast-codeql, sast-bandit, sca-trivy, iac-scanning, secret-scanning, container-scanning]
    if: always()

    steps:
      - name: Write summary
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scan Type | Tool | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| SAST (semantic dataflow) | CodeQL | ${{ needs.sast-codeql.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SAST (pattern matching) | Bandit | ${{ needs.sast-bandit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SCA | Trivy | ${{ needs.sca-trivy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| IaC Scanning | Trivy | ${{ needs.iac-scanning.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Detection | Gitleaks | ${{ needs.secret-scanning.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Container Scan | Trivy | ${{ needs.container-scanning.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Hardened branch: all vulnerabilities remediated. See REMEDIATION.md for full before/after detail." >> $GITHUB_STEP_SUMMARY
