name: DevSecOps Pipeline

on:
  push:
    branches: [ main, hardened ]
  pull_request:
    branches: [ main, hardened ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.9'

jobs:

  # ==========================================
  # SAST - Static Application Security Testing
  # ==========================================
  sast-codeql:
    name: SAST - CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a  # v3
        with:
          languages: python
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a  # v3
        with:
          category: "/language:python"

  # ==========================================
  # SCA - Software Composition Analysis
  # ==========================================
  sca-trivy:
    name: SCA - Dependency Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # master (v0.36.0)
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-sca-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '1'

      - name: Upload Trivy SCA results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a  # v3
        if: always()
        with:
          sarif_file: 'trivy-sca-results.sarif'
          category: 'sca-trivy'

  # ==========================================
  # IaC - Infrastructure as Code Scanning
  # ==========================================
  iac-scanning:
    name: IaC - Terraform Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Run Trivy IaC scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # master (v0.36.0)
        with:
          scan-type: 'config'
          scan-ref: 'terraform/'
          format: 'sarif'
          output: 'trivy-iac-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '1'

      - name: Upload IaC scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a  # v3
        if: always()
        with:
          sarif_file: 'trivy-iac-results.sarif'
          category: 'iac-trivy'

  # ==========================================
  # Secret Detection
  # ==========================================
  secret-scanning:
    name: Secret Detection - Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks — filesystem scan (working tree)
        # Scans all files present in the working tree at HEAD.
        # This is the primary pass: catches secrets in currently committed files
        # such as hardcoded AWS keys in terraform/main.tf and API keys in src/.
        # --no-git disables git-log walking so it scans files directly.
        run: |
          docker run --rm \
            -v "$(pwd):/path" \
            ghcr.io/gitleaks/gitleaks:latest \
            detect \
            --source /path \
            --no-git \
            --report-format sarif \
            --report-path /path/gitleaks-fs.sarif \
            --redact \
            --exit-code 1 || true

      - name: Run Gitleaks — git history scan (all commits)
        # Second pass: walks the full commit graph to catch secrets that were
        # introduced in earlier commits but may have since been removed from HEAD.
        # Complements the filesystem scan for complete historical coverage.
        run: |
          docker run --rm \
            -v "$(pwd):/path" \
            ghcr.io/gitleaks/gitleaks:latest \
            detect \
            --source /path \
            --log-opts="--all" \
            --report-format sarif \
            --report-path /path/gitleaks-history.sarif \
            --redact \
            --exit-code 1 || true

      - name: Merge SARIF outputs into single file for upload
        if: always()
        run: |
          # Merge results arrays from both SARIF files.
          # Falls back to an empty-results SARIF if either file is missing.
          EMPTY='{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"Gitleaks","version":"8.0.0","rules":[]}},"results":[]}]}'

          FS_SARIF=$(cat gitleaks-fs.sarif 2>/dev/null || echo "$EMPTY")
          HIST_SARIF=$(cat gitleaks-history.sarif 2>/dev/null || echo "$EMPTY")

          # Combine the results arrays from both runs into a single SARIF file.
          # jq deduplicates by fingerprint so the same secret found in both
          # passes appears only once in the Security tab.
          echo "$FS_SARIF" | jq \
            --argjson hist "$HIST_SARIF" \
            '.runs[0].results = (
              (.runs[0].results + $hist.runs[0].results)
              | unique_by(.fingerprints["matchSHA/v1"] // .message.text)
            )' > gitleaks-results.sarif

          FINDING_COUNT=$(jq '.runs[0].results | length' gitleaks-results.sarif)
          echo "Gitleaks findings: $FINDING_COUNT" >> $GITHUB_STEP_SUMMARY

      - name: Upload Gitleaks results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a  # v3
        if: always()
        with:
          sarif_file: gitleaks-results.sarif
          category: 'secrets-gitleaks'

  # ==========================================
  # Container Security
  # ==========================================
  container-scanning:
    name: Container Security - Image Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [sast-codeql, sca-trivy]
    if: always()
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Build Docker image
        run: docker build -t devsecops-demo:latest .

      - name: Run Trivy container scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # master (v0.36.0)
        with:
          image-ref: 'devsecops-demo:latest'
          format: 'sarif'
          output: 'trivy-container-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload container scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a  # v3
        if: always()
        with:
          sarif_file: 'trivy-container-results.sarif'
          category: 'container-trivy'

  # ==========================================
  # Deployment (commented out — portfolio context)
